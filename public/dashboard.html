<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Operations Telemetry Dashboard</title>
    <!-- CDN Rasmi Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; color: #333; }
        .dashboard-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-box { max-width: 400px; margin: 30px auto; min-height: 300px; }
        h2 { text-align: center; color: #1e293b; }
        .nav-btn { display: inline-block; padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <a href="index.html" class="nav-btn">← Back to Input Gateway</a>
        <h2>Risk Distribution Analytics Ledger</h2>
        <div class="chart-box">
            <canvas id="anomalyChart"></canvas>
        </div>
    </div>

    <script>
        let myAnomalyChart = null;

        async function renderTelemetry() {
            let data;
            
            // 1. Ambil Data dari API atau Fallback
            try {
                const response = await fetch('/api/v1/analytics-summary?t=' + Date.now());
                if (!response.ok) {
                    throw new Error('API server unreachable');
                }
                data = await response.json();
                console.log("✅ Live API Data Loaded:", data);
            } catch (error) {
                console.warn("⚠️ Backend offline. Activating Mock Data Fallback for GitHub Pages.");
                // Mock Data Fallback
                data = {
                    approved: 14,
                    rejected: 5,
                    capApplied: 3,
                    audit: 2
                };
            }

            // 2. Lukis Carta Pie
            try {
                const canvas = document.getElementById('anomalyChart');
                if (!canvas) {
                    console.error("❌ Canvas element 'anomalyChart' not found.");
                    return;
                }

                if (myAnomalyChart !== null) {
                    myAnomalyChart.destroy();
                }

                const ctx = canvas.getContext('2d');
                myAnomalyChart = new Chart(ctx, {
                    type: 'pie',
                    data: {
                        labels: ['APPROVED', 'REJECTED', 'LIMIT CAP APPLIED', 'FLAGGED FOR MANUAL AUDIT'],
                        datasets: [{
                            data: [data.approved, data.rejected, data.capApplied, data.audit],
                            backgroundColor: ['#3b82f6', '#f97316', '#a855f7', '#84cc16']
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true
                    }
                });
                console.log("📊 Chart rendered successfully!");
            } catch (chartErr) {
                console.error("❌ Exception during chart initialization:", chartErr);
            }
        }

        // Jalankan apabila DOM sedia
        document.addEventListener("DOMContentLoaded", renderTelemetry);
    </script>
</body>
</html>
