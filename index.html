<!DOCTYPE html>
<html lang="en">
<head>
    <title>Enterprise Risk & Compliance Engine</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f9; }
        .container { background: white; padding: 30px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Risk Validation Engine</h2>
        <input type="number" id="income" placeholder="Monthly Income (RM)">
        <input type="number" id="debt" placeholder="Existing Monthly Debt (RM)">
        <select id="employment">
            <option value="PERMANENT">Permanent Employment</option>
            <option value="FREELANCE">Freelance / Variable Income</option>
        </select>
        <input type="number" id="request" placeholder="Requested Credit Limit (RM)">
        
        <!-- Pintu Utama: Trafik akan lalui Security Gateway dahulu -->
        <button onclick="handleIncomingTraffic()">Evaluate System Risk</button>
        <div id="result"></div>
    </div>

    <!-- Struktur Pengasingan Fail Industri (Separation of Concerns) -->
    <script src="security-gateway.js"></script>
    <script src="financial-core.js"></script>
    
    <script>
        let logs = []; // Global telemetry log matrix
    </script>
</body>
</html>
